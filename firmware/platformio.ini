; PlatformIO Project Configuration File for AqOne Firmware
; Pinned board and library versions for Heltec WiFi LoRa 32 V3 (ESP32-S3)
; See firmware/README.md for details

[platformio]
default_envs = buoy, shore

[env]
platform = espressif32 @ ^6.5.0
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
extra_scripts = pre:select_src_dir.py

[env:buoy]
custom_src_dir = buoy/AqOneBuoy
build_flags =
  -DWEBSOCKETS_SERVER_CLIENT_MAX=10
lib_deps =
  bblanchon/ArduinoJson @ ^7.0.0
  links2004/WebSockets @ ^2.4.1
  adafruit/Adafruit SSD1306 @ ^2.5.9
  adafruit/Adafruit GFX Library @ ^1.11.9
  adafruit/Adafruit BusIO @ ^1.16.1
  jgromes/RadioLib @ ^7.0.0

[env:shore]
custom_src_dir = shore/AqOneShore
lib_deps =
  bblanchon/ArduinoJson @ ^7.0.0
  adafruit/Adafruit SSD1306 @ ^2.5.9
  adafruit/Adafruit GFX Library @ ^1.11.9
  adafruit/Adafruit BusIO @ ^1.16.1
  jgromes/RadioLib @ ^7.0.0
