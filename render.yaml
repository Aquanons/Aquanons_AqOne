databases:
  # Rotation steps: docs/runbooks/RENDER_FREE_DB_ROTATION.md
  - name: aqone-db
    plan: free
    databaseName: aqone
    user: aqone

services:
  - type: web
    name: aqone-backend
    runtime: docker
    repo: https://github.com/Aquanons/Aquanons_AqOne
    branch: master
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/ready
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aqone-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_SETUP_KEY
        generateValue: true
      # The LoRa shore gateway's credential, for GET /api/sos/downlink and the
      # /api/v1 ingest routes. Without it require_gateway_key rejects every
      # request, the dispatcher's acknowledgement and ETA never reach the
      # boats, and nothing in the backend logs says why - so it is declared
      # here rather than left to be remembered. Copy the generated value from
      # the Render dashboard into GATEWAY_API_KEY in
      # firmware/shore/AqOneShore/AqOneShore.ino.
      - key: GATEWAY_API_KEY
        generateValue: true
      - key: JWT_EXPIRY_HOURS
        value: "168"
      - key: SEMAPHORE_API_KEY
        sync: false
      - key: ONCALL_SMS_NUMBERS
        sync: false
      - key: SEMAPHORE_SENDER_NAME
        sync: false
      - key: DB_EXPIRES_AT
        sync: false
