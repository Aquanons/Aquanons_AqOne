[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["EXE002"]

[tool.ruff.lint.isort]
# Without this, ruff decides `app.x.y` is first-party only if app/x/y already exists, so a red test
# for a module not written yet sorts differently once it is, and the cached result hides the change.
known-first-party = ["app"]

[tool.ruff.lint.flake8-bugbear]
# B008 flags function calls in argument defaults, but `Depends(...)` in a
# default is the documented FastAPI dependency-injection idiom, not a mutable
# default argument bug. Allow it rather than ignoring B008 everywhere.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.Header"]

[tool.pytest.ini_options]
testpaths = ["tests"]
